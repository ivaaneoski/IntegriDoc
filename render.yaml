services:
  - type: web
    name: integridoc
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -e ."
    startCommand: "uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: THRESHOLD_LOW
        value: "0.35"
      - key: THRESHOLD_HIGH
        value: "0.65"
      - key: GEMINI_API_KEY
        sync: false
